name: Build macOS Intel DMG

# 从官方 deepseek-ai/deepseek-harness 的 tag 构建 macOS x86_64 桌面版，发布到本仓库 Release。
# 产物未签名、未公证（ad-hoc 签名），只提供 dmg，不含 Electron 自动更新通道。
#
# 只由手动触发或 sync.yml 派发，push 不触发。

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '上游源码 ref；留空则自动取最新 dsh-v* tag'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-intel
  cancel-in-progress: false

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  DSH_DESKTOP_TARGET_PLATFORM: darwin
  DSH_DESKTOP_TARGET_ARCH: x64

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      version: ${{ steps.pick.outputs.version }}
      sha: ${{ steps.pick.outputs.sha }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - name: 选择上游版本
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${{ inputs.source_ref }}"
          if [ -z "$ref" ]; then
            # 按发布时间的倒序取第一个 dsh-v* tag
            ref=$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=30" \
              --jq '[.[] | select(.tag_name | startswith("dsh-v"))][0].tag_name')
          fi
          test -n "$ref" || { echo '未能解析上游 tag'; exit 1; }
          version="${ref#dsh-v}"
          # 解析成 commit SHA：tag 是可移动引用，构建溯源只认 SHA
          sha=$(gh api "repos/${UPSTREAM_REPO}/commits/${ref}" --jq .sha)
          test -n "$sha" || { echo '未能解析上游 commit'; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "上游版本：$ref@$sha"
          if gh release view "intel-v${version}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "intel-v${version} 已存在，跳过构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - name: 环境与磁盘
        run: |
          sw_vers
          uname -m
          df -h /

      - name: 检出上游源码
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.resolve.outputs.ref }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: src/package.json
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: 磁盘（安装后）
        run: df -h /

      - name: 构建未签名 x64 dmg
        working-directory: src
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: 磁盘（构建后）
        if: always()
        run: df -h /

      - name: 收集打包日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: packaging-logs-${{ github.run_id }}
          path: src/apps/desktop/.desktop-build/**/events.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: 规整产物
        id: stage
        env:
          UPSTREAM_REF: ${{ needs.resolve.outputs.ref }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
          UPSTREAM_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          dmg=$(find src -type f -name '*.dmg' -not -path '*/node_modules/*' | head -n 1)
          test -n "$dmg" || { echo '未产出 dmg'; exit 1; }
          # 构建溯源：checkout 的实际 commit 必须和 resolve 解析的 SHA 一致
          built_sha=$(git -C src rev-parse HEAD)
          test "$built_sha" = "$UPSTREAM_SHA" || {
            echo "源码 commit 与解析结果不一致：${built_sha} != ${UPSTREAM_SHA}"; exit 1; }
          mkdir -p out
          cp "$dmg" out/dsh-mac-intel-latest.dmg
          # Release tag 用 resolve 的版本号（和 sync.yml 的跳过判断同源），package.json 必须一致
          version="$UPSTREAM_VERSION"
          pkg_version=$(node -p "require('./src/package.json').version")
          test "$pkg_version" = "$version" || {
            echo "package.json 版本 ${pkg_version} 与上游 tag 版本 ${version} 不一致"; exit 1; }
          printf '%s\n' "$version" > out/version.txt
          {
            echo "upstream_repo=${UPSTREAM_REPO}"
            echo "upstream_ref=${UPSTREAM_REF}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "build_run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > out/source.txt
          ( cd out && shasum -a 256 dsh-mac-intel-latest.dmg > SHA256SUMS.txt )
          ls -lh out
          cat out/SHA256SUMS.txt out/source.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          UPSTREAM_REF: ${{ needs.resolve.outputs.ref }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "intel-v${VERSION}" \
            out/dsh-mac-intel-latest.dmg out/version.txt out/SHA256SUMS.txt out/source.txt \
            --repo "${{ github.repository }}" \
            --title "DSH ${VERSION} · Mac Intel（未签名）" \
            --notes "由上游 ${UPSTREAM_REPO} 的 ${UPSTREAM_REF}（commit ${UPSTREAM_SHA}）源码在 GitHub Actions macos-15-intel 上构建，溯源信息见 source.txt。安装：下载 dsh-mac-intel-latest.dmg，双击挂载，把 DeepSeek Harness.app 拖进「应用程序」；首次打开前执行 sudo xattr -dr com.apple.quarantine \"/Applications/DeepSeek Harness.app\"。未签名、未公证（ad-hoc 签名），不支持 Electron 内置自动更新，请用 updater/dsh-intel-update.sh 更新，SHA256 见 SHA256SUMS.txt。"
